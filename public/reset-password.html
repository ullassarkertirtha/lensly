<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | LensLy</title>
  <meta name="description" content="Set a new password for your LensLy account." />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 16px 80px;
    }
    .auth-box {
      width: 100%;
      max-width: 420px;
    }
    .auth-box h1 {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .auth-subtitle {
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 32px;
    }
  </style>
</head>
<body>

  <div id="offer-banner">
    <span id="offer-msg"></span>
    <span>—</span>
    <span style="color:#9a9a9a;font-size:11px">Ends in</span>
    <span id="offer-countdown" class="countdown"></span>
  </div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">LensLy</a>
      <div class="navbar-right">
        <a href="/cart.html">
          Cart<span id="cart-count" class="cart-count" style="display:none"></span>
        </a>
      </div>
    </div>
  </nav>

  <main class="page-enter">
    <div class="auth-page">
      <div class="auth-box">
        <h1>Reset Password</h1>
        <p class="auth-subtitle">Enter your new password below.</p>

        <div class="form-group">
          <label class="form-label">New Password</label>
          <div style="position:relative">
            <input type="password" id="f-password" class="form-input" placeholder="Min 6 characters" style="padding-right:48px" autocomplete="new-password" />
            <button type="button" onclick="togglePassword()" id="toggle-pw" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:12px;font-family:var(--font-body);padding:0;letter-spacing:0.04em">SHOW</button>
          </div>
        </div>

        <div class="form-error" id="form-error"></div>
        <button class="submit-btn" id="submit-btn" onclick="doPasswordReset()">Update Password</button>
      </div>
    </div>
  </main>

    <footer class="footer">
    <div class="footer-inner">
      <div class="footer-grid">
        <div class="footer-col">
          <p class="footer-col-title">About</p>
          <a href="/about.html">Our Story</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Contact</p>
          <a href="/contact.html">Contact Us</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Support</p>
          <a href="/support.html">Help Center</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Legal</p>
          <a href="/privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      LensLy © 2026 — All Rights Reserved
    </div>
  </footer>

  <!-- Supabase CDN needed for auth.updateUser() — must run client-side with the
       short-lived access_token that comes in the email link hash fragment. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/offers.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://datvkmcwzzoamquduxmu.supabase.co',
      'sb_publishable_5TT9CDCJgx1A5r84Zu05xA_qPvBV_d4'
    )

    // Supabase sends the session tokens in the URL hash after the user clicks
    // the reset link in their email. Parse them and restore the session so
    // auth.updateUser() is authorised.
    const hash = window.location.hash.substring(1)
    const hashParams = new URLSearchParams(hash)
    const access_token = hashParams.get('access_token')
    const refresh_token = hashParams.get('refresh_token')

    const errEl = document.getElementById('form-error')
    const submitBtn = document.getElementById('submit-btn')

    if (!access_token) {
      errEl.textContent = 'Invalid or expired reset link. Please request a new one.'
      errEl.classList.add('visible')
      submitBtn.disabled = true
    } else {
      _sb.auth.setSession({ access_token, refresh_token })
    }

    async function doPasswordReset() {
      const password = document.getElementById('f-password').value
      errEl.classList.remove('visible')

      if (!password || password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.'
        errEl.classList.add('visible')
        return
      }

      submitBtn.disabled = true
      submitBtn.textContent = 'Updating...'

      const { error } = await _sb.auth.updateUser({ password })

      if (error) {
        errEl.textContent = error.message
        errEl.classList.add('visible')
        submitBtn.disabled = false
        submitBtn.textContent = 'Update Password'
        return
      }

      location.href = '/login.html?reset=true'
    }

    function togglePassword() {
      const input = document.getElementById('f-password')
      const btn = document.getElementById('toggle-pw')
      if (input.type === 'password') { input.type = 'text'; btn.textContent = 'HIDE' }
      else { input.type = 'password'; btn.textContent = 'SHOW' }
    }

    // auth.js isn't loaded here — this page is accessed via email link
    // before the user has a session, so initNav() isn't needed.
    // Cart count is still shown via nav.js + cart.js.
    const _cart = JSON.parse(localStorage.getItem('ll_cart') || '[]')
    const _total = _cart.reduce((s, i) => s + i.qty, 0)
    const _el = document.getElementById('cart-count')
    if (_el && _total > 0) { _el.textContent = _total; _el.style.display = 'inline-flex' }
  </script>
</body>
</html>
