<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | LensLy</title>
    <meta name="description"
        content="Reset your LensLy account password — enter your email and we'll send you a link." />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .auth-page {
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 16px 80px;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
        }

        .auth-box h1 {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--gray-500);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .auth-success {
            display: none;
            font-size: 12px;
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 10px 14px;
            border-radius: var(--radius);
            margin-bottom: 18px;
        }

        .auth-success.visible {
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            font-size: 12px;
            color: var(--gray-400);
            margin-top: 16px;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .back-link:hover {
            color: var(--onyx);
        }
    </style>
</head>

<body>

    <div id="offer-banner">
        <span id="offer-msg"></span>
        <span>—</span>
        <span style="color:#9a9a9a;font-size:11px">Ends in</span>
        <span id="offer-countdown" class="countdown"></span>
    </div>

    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-logo">LensLy</a>
            <div class="navbar-right">
                <a href="/cart.html">
                    Cart<span id="cart-count" class="cart-count" style="display:none"></span>
                </a>
            </div>
        </div>
    </nav>

    <main class="page-enter">
        <div class="auth-page">
            <div class="auth-box">
                <h1>Forgot Password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

                <div class="auth-success" id="auth-success">Reset link sent! Check your inbox.</div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="f-email" class="form-input" placeholder="you@email.com"
                        autocomplete="email" />
                </div>

                <div class="form-error" id="form-error"></div>
                <button class="submit-btn" id="submit-btn" onclick="doForgot()">Send Reset Link</button>
                <a href="/login.html" class="back-link">Back to Login</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-grid">
                <div class="footer-col">
                    <p class="footer-col-title">About</p>
                    <a href="/about.html">Our Story</a>
                </div>
                <div class="footer-col">
                    <p class="footer-col-title">Contact</p>
                    <a href="/contact.html">Contact Us</a>
                </div>
                <div class="footer-col">
                    <p class="footer-col-title">Support</p>
                    <a href="/support.html">Help Center</a>
                </div>
                <div class="footer-col">
                    <p class="footer-col-title">Legal</p>
                    <a href="/privacy.html">Privacy Policy</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            LensLy © 2026 — All Rights Reserved
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/offers.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        async function doForgot() {
            const email = document.getElementById('f-email').value.trim()
            const errEl = document.getElementById('form-error')
            const successEl = document.getElementById('auth-success')
            errEl.classList.remove('visible')
            successEl.classList.remove('visible')

            if (!email) {
                errEl.textContent = 'Please enter your email.'
                errEl.classList.add('visible')
                return
            }

            const btn = document.getElementById('submit-btn')
            btn.disabled = true
            btn.textContent = 'Sending...'

            // Always returns ok regardless of whether email exists (no account leak).
            await API.forgotPassword({ email })

            successEl.classList.add('visible')
            btn.textContent = 'Link Sent'
        }

        document.getElementById('f-email').addEventListener('keydown', e => {
            if (e.key === 'Enter') doForgot()
        })

        initNav()
        initOfferBanner()
    </script>
</body>

</html>
