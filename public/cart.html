<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | LensLy</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="offer-banner">
    <span id="offer-msg"></span>
    <span>—</span>
    <span style="color:#9a9a9a;font-size:11px">Ends in</span>
    <span id="offer-countdown" class="countdown"></span>
  </div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">LensLy</a>
      <div class="navbar-right">
        <div class="nav-menu-container">
          <button id="nav-menu-btn" class="nav-menu-btn" onclick="toggleNavMenu(event)">≡ Menu</button>
          <div id="nav-dropdown" class="nav-dropdown">
            <span id="nav-username" class="nav-user-name" style="padding:12px 16px; display:block; border-bottom:1px solid #f0f0f0; font-weight:600; color:#1a1a1a;"></span>
            <a href="/login.html" id="nav-login">Login</a>
            <a href="/face-scan.html">Face Scan</a>
            <a href="/consultation.html">Doctor Consultation</a>
            <button id="nav-logout" onclick="Auth.logout()" style="display:none; text-align:left; border-top:1px solid #f0f0f0;">Logout</button>
          </div>
        </div>
        <span class="navbar-divider">|</span>
        <a href="/cart.html">
          Cart<span id="cart-count" class="cart-count" style="display:none"></span>
        </a>
      </div>
    </div>
  </nav>

  <main class="page-enter">
    <div class="cart-page">
      <h1>Your Cart</h1>
      <div id="cart-content"></div>
    </div>
  </main>

    <footer class="footer">
    <div class="footer-inner">
      <div class="footer-grid">
        <div class="footer-col">
          <p class="footer-col-title">About</p>
          <a href="/about.html">Our Story</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Contact</p>
          <a href="/contact.html">Contact Us</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Support</p>
          <a href="/support.html">Help Center</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Legal</p>
          <a href="/privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      LensLy © 2026 — All Rights Reserved
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/offers.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    // Must match config/constants.js SHIPPING_FEE on the backend — the server
    // always recalculates the authoritative total at checkout, this is display only.
    const SHIPPING_FEE = 100

    async function renderCart() {
      const cart = Cart.get()
      const content = document.getElementById('cart-content')

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="empty-cart">
            <p>Your cart is empty.</p>
            <a href="/" class="checkout-btn" style="display:inline-block;width:auto;padding:12px 28px">Continue Shopping</a>
          </div>`
        return
      }

      // 1. Instantly render the layout and items (Synchronous)
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0)
      
      content.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items" id="items-list"></div>
          <div class="order-summary">
            <div class="order-summary-title">Order Summary</div>
            <div id="offer-applied-banner"></div>
            <div class="summary-row"><span>Subtotal</span><span>৳ ${subtotal.toLocaleString()}</span></div>
            <div class="summary-row"><span>Shipping</span><span id="shipping-display">...</span></div>
            <hr class="summary-divider" />
            <div class="summary-total"><span>Total</span><span id="grand-total-display">...</span></div>
            <a href="/checkout.html" class="checkout-btn">Proceed to Checkout</a>
            <a href="/" class="continue-link">Continue Shopping</a>
            <p class="cod-note">Cash on Delivery only</p>
          </div>
        </div>`

      const list = document.getElementById('items-list')
      cart.forEach((item, idx) => {
        const div = document.createElement('div')
        div.className = 'cart-item'
        div.innerHTML = `
          <div class="cart-item-img">
            <img src="/glasses/${item.folder_id}/1.jpg" alt="${item.name}" />
          </div>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-desc">${item.description || ''}</div>
            <div class="cart-item-desc">${item.lens_type}${item.lens_power ? ' — ' + item.lens_power : ''}</div>
            <div class="cart-item-bottom">
              <div class="cart-qty-control">
                <button class="cart-qty-btn" onclick="updateQty(${idx}, ${item.qty - 1})">−</button>
                <span class="cart-qty-value">${item.qty}</span>
                <button class="cart-qty-btn" onclick="updateQty(${idx}, ${item.qty + 1})">+</button>
              </div>
              <div class="cart-item-price">৳ ${(item.price * item.qty).toLocaleString()}</div>
              <button class="remove-btn" onclick="removeItem(${idx})">Remove</button>
            </div>
          </div>`
        list.appendChild(div)
      })

      list.innerHTML += `
        <div class="cart-actions">
          <button class="clear-cart-btn" onclick="clearAll()">Clear cart</button>
        </div>`

      // 2. Fetch offers asynchronously and update totals
      API.getOffers().then(offerData => {
        const offers = offerData.offers || []
        const { discountLabel, isFreeShipping } = Offers.calculate(0, offers)
        
        const shippingAmount = isFreeShipping ? 0 : SHIPPING_FEE
        const grand = subtotal + shippingAmount
        
        document.getElementById('shipping-display').textContent = isFreeShipping ? 'Free' : `৳ ${SHIPPING_FEE}`
        document.getElementById('grand-total-display').textContent = `৳ ${grand.toLocaleString()}`
        
        if (discountLabel) {
          document.getElementById('offer-applied-banner').innerHTML = `<div class="offer-applied">${discountLabel} applied</div>`
        }
      }).catch(err => {
        document.getElementById('shipping-display').textContent = `৳ ${SHIPPING_FEE}`
        document.getElementById('grand-total-display').textContent = `৳ ${(subtotal + SHIPPING_FEE).toLocaleString()}`
      })
    }

    function updateQty(idx, newQty) {
      if (newQty < 1) return
      const cart = Cart.get()
      cart[idx].qty = newQty
      Cart.save(cart)
      initNav()
      renderCart()
    }

    function removeItem(idx) {
      const cart = Cart.get()
      cart.splice(idx, 1)
      Cart.save(cart)
      initNav()
      renderCart()
    }

    function clearAll() {
      Cart.clear()
      initNav()
      renderCart()
    }

    initNav()
    initOfferBanner()
    renderCart()
  </script>
</body>
</html>
