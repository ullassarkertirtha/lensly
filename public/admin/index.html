<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | LensLy Admin</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <!-- Mobile top bar -->
  <div class="admin-mobile-bar">
    <div class="admin-mobile-logo">LensLy <span>Admin</span></div>
    <button class="admin-hamburger" id="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
  </div>
  <div class="admin-mobile-nav" id="mobile-nav">
    <a href="/admin/index.html" class="active">Dashboard</a>
    <a href="/admin/orders.html">Orders</a>
    <a href="/admin/products.html">Products</a>
    <a href="/admin/offers.html">Offers</a>
    <a href="/admin/consultations.html">Consultations</a>
    <div class="mobile-footer">
      <span id="mob-username"></span>
      <button onclick="AdminAuth.logout()">Sign out</button>
    </div>
  </div>

  <div class="admin-layout">

    <!-- Desktop sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-logo">LensLy<span>Admin Panel</span></div>
      <nav class="admin-sidebar-nav">
        <a href="/admin/index.html" class="active">Dashboard</a>
        <a href="/admin/orders.html">Orders</a>
        <a href="/admin/products.html">Products</a>
        <a href="/admin/offers.html">Offers</a>
        <a href="/admin/consultations.html">Consultations</a>
      </nav>
      <div class="admin-sidebar-footer">
        <strong id="sb-username">Admin</strong>
        <button onclick="AdminAuth.logout()">Sign out</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="admin-main">
      <div class="admin-topbar"><h1>Dashboard</h1></div>
      <div class="admin-content">

        <div class="stat-grid">
          <div class="stat-card"><div class="stat-card-label">Total Orders</div><div class="stat-card-value" id="s-orders">—</div></div>
          <div class="stat-card"><div class="stat-card-label">Total Revenue</div><div class="stat-card-value" id="s-revenue">—</div></div>
          <div class="stat-card"><div class="stat-card-label">Active Offers</div><div class="stat-card-value" id="s-offers">—</div></div>
          <div class="stat-card"><div class="stat-card-label">Pending Consultations</div><div class="stat-card-value" id="s-cons">—</div></div>
        </div>

        <p class="section-heading">Low Stock Alert — 3 units or fewer</p>
        <ul class="low-stock-list" id="low-stock">
          <li style="color:#9a9a9a;font-size:12px;padding:14px 16px">Loading…</li>
        </ul>

      </div>
    </div>

  </div>

  <script src="/js/admin/auth.js"></script>
  <script>
    AdminAuth.requireLogin()
    const uname = AdminAuth.getUsername() || 'Admin'
    document.getElementById('sb-username').textContent = uname
    document.getElementById('mob-username').textContent = uname

    function toggleMobileNav() {
      const nav = document.getElementById('mobile-nav')
      const btn = document.getElementById('hamburger')
      nav.classList.toggle('open')
      btn.classList.toggle('open')
    }

    async function loadDashboard() {
      const res = await AdminAuth.fetch('/api/admin/dashboard-summary')
      const data = await res.json()

      document.getElementById('s-orders').textContent = data.totalOrders ?? '—'
      document.getElementById('s-revenue').textContent = data.totalRevenue != null
        ? '৳' + Number(data.totalRevenue).toLocaleString()
        : '—'
      document.getElementById('s-offers').textContent = data.activeOffers ?? '—'
      document.getElementById('s-cons').textContent = data.pendingConsultations ?? '—'

      const list = document.getElementById('low-stock')
      if (!data.lowStock || !data.lowStock.length) {
        list.innerHTML = '<li style="color:#9a9a9a;font-size:12px;padding:14px 16px">No low-stock items — all good.</li>'
      } else {
        list.innerHTML = data.lowStock.map(p => `
          <li>
            <span>${escHtml(p.name)} <span style="color:#9a9a9a;font-size:11px">(${escHtml(p.folder_id)})</span></span>
            <span class="stock-badge">${p.stock} left</span>
          </li>
        `).join('')
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    }

    loadDashboard()
  </script>
</body>
</html>
