<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | LensLy</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background: var(--gray-50); }
    .admin-login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .admin-login-box {
      width: 100%;
      max-width: 380px;
      background: var(--white);
      padding: 40px 32px;
      border: 1px solid var(--gray-200);
    }
    .admin-login-box h1 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .admin-login-sub {
      font-size: 12px;
      color: var(--gray-400);
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="admin-login-page">
    <div class="admin-login-box">
      <h1>LensLy Admin</h1>
      <p class="admin-login-sub">Restricted access</p>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="f-username" class="form-input" placeholder="Username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="f-password" class="form-input" placeholder="Password" autocomplete="current-password" />
      </div>

      <div class="form-error" id="form-error"></div>
      <button class="submit-btn" id="submit-btn" onclick="doAdminLogin()">Log In</button>
    </div>
  </div>

  <script src="/js/admin/auth.js"></script>
  <script>
    // Already logged in? Skip straight to the dashboard.
    if (AdminAuth.isLoggedIn()) location.href = '/admin/index.html'

    async function doAdminLogin() {
      const username = document.getElementById('f-username').value.trim()
      const password = document.getElementById('f-password').value
      const errEl = document.getElementById('form-error')
      errEl.classList.remove('visible')

      if (!username || !password) {
        errEl.textContent = 'Please enter both fields.'
        errEl.classList.add('visible')
        return
      }

      const btn = document.getElementById('submit-btn')
      btn.disabled = true
      btn.textContent = 'Logging in...'

      let data
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        })
        data = await res.json()
      } catch (err) {
        errEl.textContent = 'Could not reach the server. Please check your connection and try again.'
        errEl.classList.add('visible')
        btn.disabled = false
        btn.textContent = 'Log In'
        return
      }

      if (data.error) {
        errEl.textContent = data.error
        errEl.classList.add('visible')
        btn.disabled = false
        btn.textContent = 'Log In'
        return
      }

      AdminAuth.setSession(data.token, data.username)
      location.href = '/admin/index.html'
    }

    document.getElementById('f-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doAdminLogin()
    })
  </script>
</body>
</html>
