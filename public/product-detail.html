<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product | LensLy</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="offer-banner">
    <span id="offer-msg"></span>
    <span>—</span>
    <span style="color:#9a9a9a;font-size:11px">Ends in</span>
    <span id="offer-countdown" class="countdown"></span>
  </div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">LensLy</a>
      <div class="navbar-right">
        <div class="nav-menu-container">
          <button id="nav-menu-btn" class="nav-menu-btn" onclick="toggleNavMenu(event)">≡ Menu</button>
          <div id="nav-dropdown" class="nav-dropdown">
            <span id="nav-username" class="nav-user-name" style="padding:12px 16px; display:block; border-bottom:1px solid #f0f0f0; font-weight:600; color:#1a1a1a;"></span>
            <a href="/login.html" id="nav-login">Login</a>
            <a href="/face-scan.html">Face Scan</a>
            <a href="/consultation.html">Doctor Consultation</a>
            <button id="nav-logout" onclick="Auth.logout()" style="display:none; text-align:left; border-top:1px solid #f0f0f0;">Logout</button>
          </div>
        </div>
        <span class="navbar-divider">|</span>
        <a href="/cart.html">
          Cart<span id="cart-count" class="cart-count" style="display:none"></span>
        </a>
      </div>
    </div>
  </nav>

  <main class="page-enter" id="main-content">
    <div class="product-page" id="product-content" style="display:none">

      <div>
        <div class="gallery-main">
          <img id="main-img" src="" alt="" />
        </div>
        <div class="gallery-thumbs" id="thumbs"></div>
      </div>

      <div class="product-info">
        <div>
          <div class="product-category-label" id="product-gender"></div>
          <h1 id="product-name"></h1>
          <p class="product-info-desc" id="product-desc"></p>
        </div>
        <div class="product-price" id="product-price"></div>
        <hr class="product-divider" />

        // lens type and power

        <hr class="product-divider" />
        <div id="stock-msg"></div>
        <div class="qty-row">
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <span class="qty-value" id="qty-display">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
          <button class="add-to-cart-btn" id="add-btn">Add to Cart</button>
        </div>
      </div>

    </div>
  </main>

  // reviews

    <footer class="footer">
    <div class="footer-inner">
      <div class="footer-grid">
        <div class="footer-col">
          <p class="footer-col-title">About</p>
          <a href="/about.html">Our Story</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Contact</p>
          <a href="/contact.html">Contact Us</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Support</p>
          <a href="/support.html">Help Center</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Legal</p>
          <a href="/privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      LensLy © 2026 — All Rights Reserved
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/offers.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/product-detail.js"></script>
</body>
</html>
