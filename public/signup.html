<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | LensLy</title>
  <meta name="description" content="Create a LensLy account to place orders, write reviews, and book doctor consultations." />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 16px 80px;
    }
    .auth-box {
      width: 100%;
      max-width: 420px;
    }
    .auth-box h1 {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .auth-subtitle {
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 32px;
    }
    .auth-subtitle a {
      color: var(--onyx);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--gray-400);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      color: var(--onyx);
      font-family: var(--font-body);
      transition: border-color var(--transition), background var(--transition);
      cursor: pointer;
      background: var(--white);
    }
    .google-btn:hover { border-color: var(--onyx); background: var(--gray-50); }
    .google-btn svg { flex-shrink: 0; }
    .terms-note {
      font-size: 11px;
      color: var(--gray-400);
      margin-top: 12px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="offer-banner">
    <span id="offer-msg"></span>
    <span>—</span>
    <span style="color:#9a9a9a;font-size:11px">Ends in</span>
    <span id="offer-countdown" class="countdown"></span>
  </div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">LensLy</a>
      <div class="navbar-right">
        <a href="/cart.html">
          Cart<span id="cart-count" class="cart-count" style="display:none"></span>
        </a>
      </div>
    </div>
  </nav>

  <main class="page-enter">
    <div class="auth-page">
      <div class="auth-box">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Already have an account? <a href="/login.html">Log in</a></p>

        <!-- Google OAuth -->
        <button class="google-btn" id="google-btn" onclick="doGoogleSignup()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Sign up with Google
        </button>

        <div class="auth-divider">or</div>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="f-name" class="form-input" placeholder="Your full name" autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="f-email" class="form-input" placeholder="you@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative">
            <input type="password" id="f-password" class="form-input" placeholder="Min 6 characters" style="padding-right:48px" autocomplete="new-password" />
            <button type="button" onclick="togglePassword()" id="toggle-pw" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:12px;font-family:var(--font-body);padding:0;letter-spacing:0.04em">SHOW</button>
          </div>
        </div>

        <div class="form-error" id="form-error"></div>
        <button class="submit-btn" id="submit-btn" onclick="doSignup()">Create Account</button>

      </div>
    </div>
  </main>

    <footer class="footer">
    <div class="footer-inner">
      <div class="footer-grid">
        <div class="footer-col">
          <p class="footer-col-title">About</p>
          <a href="/about.html">Our Story</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Contact</p>
          <a href="/contact.html">Contact Us</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Support</p>
          <a href="/support.html">Help Center</a>
        </div>
        <div class="footer-col">
          <p class="footer-col-title">Legal</p>
          <a href="/privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      LensLy © 2026 — All Rights Reserved
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/offers.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    const _sb = window.supabase.createClient(
      'https://datvkmcwzzoamquduxmu.supabase.co',
      'sb_publishable_5TT9CDCJgx1A5r84Zu05xA_qPvBV_d4'
    )

    async function doSignup() {
      const name = document.getElementById('f-name').value.trim()
      const email = document.getElementById('f-email').value.trim()
      const password = document.getElementById('f-password').value
      const errEl = document.getElementById('form-error')
      errEl.classList.remove('visible')

      if (!name || !email || !password) {
        errEl.textContent = 'All fields are required.'
        errEl.classList.add('visible')
        return
      }
      if (password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.'
        errEl.classList.add('visible')
        return
      }

      const btn = document.getElementById('submit-btn')
      btn.disabled = true
      btn.textContent = 'Creating account...'

      const data = await API.signup({ name, email, password })

      if (data.error) {
        errEl.textContent = data.error
        errEl.classList.add('visible')
        btn.disabled = false
        btn.textContent = 'Create Account'
        return
      }

      location.href = '/login.html?registered=true'
    }

    async function doGoogleSignup() {
      const btn = document.getElementById('google-btn')
      btn.disabled = true
      btn.style.opacity = '0.6'
      await _sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/login.html' },
      })
    }

    function togglePassword() {
      const input = document.getElementById('f-password')
      const btn = document.getElementById('toggle-pw')
      if (input.type === 'password') { input.type = 'text'; btn.textContent = 'HIDE' }
      else { input.type = 'password'; btn.textContent = 'SHOW' }
    }

    initNav()
    initOfferBanner()
  </script>
</body>
</html>
